cases:
  - name: herald-recent
    type: summary
    repo: .
    range: HEAD~3..HEAD
    lang: ru

  - name: herald-recent-en
    type: summary
    repo: .
    range: HEAD~3..HEAD
    lang: en

  # `root` points at a local checkout of the Mind product's mind_api
  # sub-project — the code-only unit whose sources live under a top-level
  # src/, matching CodeSourceStrategy's root-anchored prefixes (the product
  # root itself has no top-level src/ and carries its own .ai-factory/, so
  # it selects nothing). `make eval` writes evals/out/mind-features.md; the
  # comparison reference evals/reference/mind-features.md is user-authored —
  # never fabricated by the implementer, same discipline as the
  # summarization eval.
  - name: mind-features
    type: distill
    repo: mind-api
    root: /Users/max/projects/mind/mind_api

  # `repo` is the bare push.repo key under which repo-stats-herald's own
  # knowledge and episodic entries are stored — populate both stores first
  # via `uv run python -m scripts.backfill_episodic --repo repo-stats-herald
  # --org-id 244165546` (knowledge backfill likewise) before `make eval`
  # yields a grounded answer instead of the honest no-memory path. `make eval`
  # writes evals/out/herald-self-query.md; the comparison reference
  # evals/reference/herald-self-query.md is user-authored — never fabricated
  # by the implementer, same discipline as the summarization/distillation evals.
  - name: herald-self-query
    type: reasoner
    repo: repo-stats-herald
    query: What has changed recently in repo-stats-herald?

  # Pivot is `en`, so `ru` is genuinely translated from the `en` narration
  # rather than reasoned independently — exercises PivotLocalizer end to end.
  # `make eval` writes evals/out/herald-localize.md; the comparison reference
  # evals/reference/herald-localize.md is user-authored — never fabricated
  # by the implementer, same discipline as the summarization/narrate evals.
  - name: herald-localize
    type: localize
    repo: .
    range: HEAD~3..HEAD
    langs: [en, ru]

  # range is a fixed commit pair (not HEAD-relative) so this case's input
  # doesn't drift under evals/reference/herald-narrate.md, which is
  # user-authored — never fabricated by the implementer, same discipline
  # as the other reasoner-family evals. name is pinned to match that
  # reference file; EvalRunner pairs a case to its reference by name alone.
  - name: herald-narrate
    type: narrate
    repo: "."
    range: 0783684467d191a44bea94aa1de521f2cb23d6df..1bb7597925f54d42184d317c4f5eb2b2fde9aabe
    lang: ru
