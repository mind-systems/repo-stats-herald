cases:
  - name: herald-recent
    type: summary
    repo: .
    range: HEAD~3..HEAD
    lang: ru

  - name: herald-recent-en
    type: summary
    repo: .
    range: HEAD~3..HEAD
    lang: en

  # `root` points at a local checkout of the Tradeoxy monorepo's
  # tradeoxy_core sub-project — the code-only unit whose sources live under
  # a top-level src/, matching CodeSourceStrategy's root-anchored prefixes
  # (the monorepo root itself has no top-level src/ and carries its own
  # .ai-factory/, so it selects nothing). `make eval` writes
  # evals/out/tradeoxy-features.md; the comparison reference
  # evals/reference/tradeoxy-features.md is user-authored — never
  # fabricated by the implementer, same discipline as the summarization eval.
  - name: tradeoxy-features
    type: distill
    repo: tradeoxy-core
    root: /Users/max/projects/tradeoxy/tradeoxy_core

  # `repo` is the bare push.repo key under which repo-stats-herald's own
  # knowledge and episodic entries are stored — populate both stores first
  # via `uv run python -m scripts.backfill_episodic --repo repo-stats-herald
  # --org-id 244165546` (knowledge backfill likewise) before `make eval`
  # yields a grounded answer instead of the honest no-memory path. `make eval`
  # writes evals/out/herald-self-query.md; the comparison reference
  # evals/reference/herald-self-query.md is user-authored — never fabricated
  # by the implementer, same discipline as the summarization/distillation evals.
  - name: herald-self-query
    type: reasoner
    repo: repo-stats-herald
    query: What has changed recently in repo-stats-herald?
