[project]
name = "repo-stats-herald"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "asyncpg",
    "fastapi",
    "httpx",
    "pydantic-settings>=2.14.2",
    "pyjwt[crypto]",
    "cryptography<49",
    "pyyaml",
    "uvicorn[standard]",
]

[dependency-groups]
dev = ["pytest", "pytest-asyncio"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
